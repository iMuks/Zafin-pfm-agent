<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penny - Spending companion</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="stage">
    <aside class="stage-note">
      <h1>Penny</h1>
      <p class="tagline">A conversational PFM agent for US retail banking.</p>
      <dl>
        <dt>Model</dt><dd id="meta-model">-</dd>
        <dt>History</dt><dd id="meta-range">-</dd>
        <dt>Transactions</dt><dd id="meta-count">-</dd>
      </dl>
      <p class="hint">Every figure Penny quotes comes from a tool call against the
        enriched transaction set - watch the chips appear as she works.</p>
    </aside>

    <div class="phone">
      <div class="phone-screen">
        <div class="status-bar">
          <span>9:41</span>
          <span class="status-icons">
            <svg viewBox="0 0 18 12" width="17"><path d="M1 9h2v3H1zM5 6.5h2V12H5zM9 4h2v8H9zM13 1h2v11h-2z" fill="currentColor"/></svg>
            <svg viewBox="0 0 16 12" width="16"><path d="M8 10.2 6.3 8.5a2.4 2.4 0 0 1 3.4 0zM3.6 5.8a6.2 6.2 0 0 1 8.8 0l-1.3 1.3a4.4 4.4 0 0 0-6.2 0zM.9 3.1a10 10 0 0 1 14.2 0l-1.3 1.3a8.2 8.2 0 0 0-11.6 0z" fill="currentColor"/></svg>
            <svg viewBox="0 0 26 12" width="24"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="1.6" fill="currentColor"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".5"/></svg>
          </span>
        </div>

        <header class="app-bar">
          <button class="icon-btn" aria-label="Back">
            <svg viewBox="0 0 24 24" width="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="app-bar-id">
            <div class="avatar" aria-hidden="true">P</div>
            <div>
              <div class="app-bar-name">Penny</div>
              <div class="app-bar-status"><span class="dot"></span>Spending companion</div>
            </div>
          </div>
          <button class="icon-btn" aria-label="More">
            <svg viewBox="0 0 24 24" width="20"><circle cx="12" cy="5" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="19" r="1.7" fill="currentColor"/></svg>
          </button>
        </header>

        <main class="thread" id="thread" aria-live="polite"></main>

        <form class="composer" id="composer" autocomplete="off">
          <input id="input" placeholder="Ask about your spending" maxlength="2000" required>
          <button id="send" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" width="19"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
