name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check penny eval scripts tests

      - name: Format check
        run: ruff format --check penny eval scripts tests

      # No API key in CI: the suite covers the parser, the component contract,
      # the guards, sessions and prompt assembly, and drives the graph with a
      # fake chat model. Nothing here calls a live model.
      - name: Test
        run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t penny-pfm-agent:${{ github.sha }} .
