[project]
name = "penny-pfm-agent"
version = "1.0.0"
description = "Penny — a conversational Personal Finance Management agent for US retail banking."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "eval/out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "ASYNC"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI dependency defaults are called in signatures by design
  "SIM108",  # explicit if/else is often clearer than a ternary here
]

[tool.ruff.lint.per-file-ignores]
# Imports follow load_dotenv() on purpose, so E402 is expected.
"penny/presentation/http/app.py" = ["E402"]
"scripts/*.py" = ["E402"]
"eval/run_eval.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["penny", "eval", "tests"]
